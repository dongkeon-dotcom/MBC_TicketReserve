<html xmlns:th="http://www.thymeleaf.org">
	<div th:replace="~{include/top::top}"></div>
	<link rel="stylesheet" th:href="@{/css/admin/showList.css}">
	
	
	
	<head>
	    <meta charset="UTF-8">
	    <title>공연 관리 목록 - 관리자</title>
	</head>
	<body>
		<div class="admin-container">
		    <h1 class="page-title">공연 통합 관리 시스템</h1>

		    <div class="section">
		        <div class="list-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
		            <h2>등록된 공연 현황</h2>
		            
		            <div class="header-right-group">
		                <form th:action="@{/admin/listPage.do}" method="get" class="search-box">
		                    <input type="text" name="keyword" th:value="${keyword}" placeholder="공연 제목 검색" class="search-input">
		                    <button type="submit" class="search-btn-admin">검색</button>
		                </form>
		                <a th:href="@{/admin/insertPage.do}" class="btn-add-main">+ 새 공연 등록하기</a>
		            </div>
		        </div>

		        <div class="batch-control-bar" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
		            <span style="font-weight: bold; font-size: 0.9em; color: #555;">선택한 공연을:</span>
		            <select id="batchStatusSelect" class="admin-select">
		                <option value="VISIBLE">일반 노출(검색 허용)</option>
		                <option value="FEATURED">메인 추천(홈 화면 노출)</option>
		                <option value="HIDDEN">숨김(검색/홈 비노출)</option>
		            </select>
		            <button type="button" onclick="applyBatchStatus()" class="btn-apply">상태 변경 적용</button>
		        </div>

		        <p class="guide-text">* 체크박스로 공연을 선택한 뒤 상단에서 노출 상태를 일괄 변경할 수 있습니다.</p>

		        <table class="admin-table">
		            <colgroup>
		                <col style="width: 4%;"> <col style="width: 6%;">  
		                <col style="width: 8%;">  
		                <col style="width: 30%;"> 
		                <col style="width: 22%;"> 
		                <col style="width: 30%;"> 
		            </colgroup>
		            <thead>
		                <tr>
		                    <th><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></th>
		                    <th>번호</th>
		                    <th>포스터</th>
							<th>공연 제목</th>
							<th>공연 상태</th>
		                    <th>공연 운영 기간</th>
		                    <th>관리 액션</th>
		                </tr>
		            </thead>
					<tbody>
					    <tr th:if="${#lists.isEmpty(performanceList)}">
					        <td colspan="6" style="padding: 100px 0; color: #bbb; text-align: center;">
					            등록된 공연 데이터가 존재하지 않습니다.
					        </td>
					    </tr>
					    
					    <tr th:each="p : ${performanceList}" 
					        th:classappend="${p.endDate != null && T(java.time.LocalDate).now().isAfter(T(java.time.LocalDate).parse(p.endDate))} ? 'expired' : ''">
					        
					        <td><input type="checkbox" class="perf-check" th:value="${p.performanceId}"></td>
					        
					        <td th:text="${p.performanceId}">1</td>
					        
					        <td>
					            <img th:if="${p.posterImageName != null}" 
					                 th:src="@{https://s3-202601052.s3.ap-northeast-2.amazonaws.com/TICKET/MAIN_POSTER/{name}(name=${p.posterImageName})}" 
					                 class="poster-thumb" style="width: 50px; height: auto;">
					        </td>
					        
					        <td class="perf-title">
					            <span th:text="${p.title}">공연 제목</span>
					            
					        </td>
					        
							<td class="perf-status">
							            <span th:if="${p.isFeatured == 1}" class="badge-featured">메인 표시 중</span>
							            
							            <span th:if="${p.isVisible == 1 && p.isFeatured == 0}" class="badge-visible">일반 노출</span>
							            
							            <span th:if="${p.isVisible == 0}" class="badge-hidden">비공개(숨김)</span>
							        </td>
									
					        <td class="perf-date">
					            <span th:text="${p.startDate}">날짜</span> ~ <span th:text="${p.endDate}">날짜</span>
					        </td>
					        
					        <td>
					            <div class="action-group">
									<!--도커에 올리시 하단의 아이피 변경 필요 -->
									<a href="#"
										th:data-id="${p.performanceId}"
										class="btn-predict btn-dynamic-link"
										style="background-color: #6c5ce7; color: white;">예상 확인</a>
									           
					                <a th:href="@{/admin/editPage.do(id=${p.performanceId})}" class="btn-edit">정보수정</a>
									<a th:href="@{/reserve/ticket.do(performanceId=${p.performanceId})}" class="btn-view" >예매페이지</a>
					                <button type="button" class="btn-delete" th:onclick="|deleteConfirm(${p.performanceId})|">삭제</button>
					            </div>
					        </td>
					    </tr>
					</tbody>
		        </table>
		    </div>
		    </div>
			<div class="pagination" style="text-align: center; margin-top: 40px; margin-bottom: 40px;">
			    
			    <a th:href="@{/admin/listPage.do(page=0, keyword=${keyword})}" class="pg-btn">[맨처음]</a>

			    <a th:href="@{/admin/listPage.do(page=${(page.number / 10 - 1) * 10 + 9}, keyword=${keyword})}" 
			       th:if="${page.number >= 10}" class="pg-btn">[이전]</a>

			    <span th:each="i : ${#numbers.sequence(
			        (page.number / 10) * 10, 
			        T(java.lang.Math).min((page.number / 10) * 10 + 9, page.totalPages > 0 ? page.totalPages - 1 : 0)
			    )}">
			        <a th:if="${page.totalPages > 0}"
			           th:href="@{/admin/listPage.do(page=${i}, keyword=${keyword})}" 
			           th:text="${i + 1}" 
			           th:classappend="${i == page.number} ? 'active' : ''"
			           class="pg-num">1</a>
			    </span>

			    <a th:href="@{/admin/listPage.do(page=${(page.number / 10 + 1) * 10}, keyword=${keyword})}" 
			       th:if="${(page.number / 10 + 1) * 10 < page.totalPages}" class="pg-btn">[다음]</a>

			    <a th:if="${page.totalPages > 0}" 
			       th:href="@{/admin/listPage.do(page=${page.totalPages - 1}, keyword=${keyword})}" class="pg-btn">[맨끝]</a>
			</div>
		
		<div th:replace="~{include/bottom::footer}"></div>
		
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
		<script th:inline="javascript">
		    document.addEventListener('DOMContentLoaded', function() {
		        // 초기 로드 시 상태 확인
		        refreshDashboard();
		        // 5초 간격 모니터링
		        setInterval(refreshDashboard, 5000);
		    });

			async function refreshDashboard() {
			    const cards = document.querySelectorAll('.q-card');
			    
			    for (let card of cards) {
			        const showId = card.id.replace('card-', ''); // id="card-123"에서 123 추출
			        
			        try {
			            // 컨트롤러의 @GetMapping("/{showId}/status")와 경로를 일치시킴
			            const res = await fetch(`/admin/queue/${showId}/status`); 
			            
			            if (res.ok) {
			                const data = await res.json();
			                // 서버가 준 {isEnabled: true, queueSize: 50} 데이터를 UI에 반영
			                updateUI(showId, data.isEnabled, data.queueSize);
			            }
			        } catch (e) {
			            console.error("데이터 갱신 실패:", showId, e);
			        }
			    }
			}

		    // 'JavaScript' 글자를 지우고 함수만 남겼습니다.
		    function updateUI(showId, isEnabled, queueSize = 0) {
		        const card = document.getElementById(`card-${showId}`);
		        const statusText = document.getElementById(`status-text-${showId}`);
		        const countElem = document.getElementById(`cnt-${showId}`);
		        
		        if (card && statusText) {
		            // 1. 가동 상태 업데이트
		            if (isEnabled === true || isEnabled === "true") {
		                card.style.borderTopColor = "#27ae60"; 
		                card.classList.add('active');
		                statusText.innerText = "🟢 가동 중";
		                statusText.style.color = "#27ae60";
		            } else {
		                card.style.borderTopColor = "#ccc"; 
		                card.classList.remove('active');
		                statusText.innerText = "🔴 중지됨";
		                statusText.style.color = "#e74c3c";
		            }

		            // 2. 인원수 업데이트
		            if (countElem) {
		                countElem.innerText = queueSize.toLocaleString();
		            }
		        }
		    }

		    async function toggleQueue(showId, action) {
		        if (!confirm(`대기열 기능을 ${action === 'enable' ? '가동' : '중지'}하시겠습니까?`)) return;

		        try {
		            const res = await fetch(`/admin/queue/${showId}/${action}`, { method: 'POST' });
		            if (res.ok) {
		                refreshDashboard(); // 즉시 갱신
		            }
		        } catch (e) {
		            alert("처리 중 오류가 발생했습니다.");
		        }
		    }
		</script>


</body>
</html>
